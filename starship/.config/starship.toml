"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = "$username[➜](fg:#62ED8B)$directory$git_branch$status "

[username]
show_always = true
disabled = false
format = "[@$user ](fg:#E36464)"

[directory]
truncation_length = 1
truncate_to_repo = false
format = "[ $path](fg:#56B6C2)"

[git_branch]
format = '[ git\(](fg:#DDB15F)[$branch](fg:#D4AAFC)[\)](fg:#DDB15F)'

[status]
disabled = false
format = "[ ](fg:#DCB977)"
