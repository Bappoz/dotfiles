include ~/.config/omarchy/current/theme/kitty.conf

# --- Fonte ---
font_family Agave Nerd Font Mono
symbol_map U+1F300-U+1FAFF Noto Color Emoji
font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto


# --- Estética da Janela ---
# Na imagem 2 não há transparência agressiva, mas deixaremos um pouco para estilo
background_opacity         0.75
window_padding_width       0
hide_window_decorations    no 
confirm_os_window_close    0
scrollback_lines            10000

# --- Cursor ---
cursor_shape               block
shell_integration          no-cursor

# --- Tema ---
include current-theme.conf

# --- Barra de Abas Simples (opcional) ---
tab_bar_style              powerline
tab_powerline_style        slanted
# wayland_titlebar_color system
linux_display_server auto

# Extras
allow_remote_control yes
listen_on unix:/tmp/kitty


# BEGIN_KITTY_THEME
# Adwaita darker
# END_KITTY_THEME
