include ~/.local/state/omarchy/current/theme/kitty.conf

# --- Fonte ---
font_family Agave Nerd Font
symbol_map U+1F300-U+1FAFF Noto Color Emoji
font_size 12.0
bold_font        auto
italic_font      auto
bold_italic_font auto


# --- Estética da Janela (opaca, preto total) ---
background_opacity         0.9
dynamic_background_opacity no
# background                 #000000
window_padding_width       2
hide_window_decorations    yes
confirm_os_window_close    0
scrollback_lines            10000

# --- Contraste do texto (sobrescreve o tema: cores mais claras/vivas sobre preto) ---
# foreground                 #f5f5f7
text_fg_override_threshold 7.0 ratio
# color0  #000000
# color8  #8a8a95
# color1  #ff8a80
# color9  #ffb0a8
# color2  #b5f0a8
# color10 #d0ffc4
# color3  #f5d58a
# color11 #ffe6a8
# color4  #8fb4ff
# color12 #b8d0ff
# color5  #d4a8ff
# color13 #e6c8ff
# color6  #7fe3e0
# color14 #b0fffc
# color7  #e6e6ea
# color15 #ffffff

# --- Cursor ---
cursor_shape               block
shell_integration          no-cursor

# --- Barra de Abas Simples (opcional) ---
tab_bar_style              powerline
tab_powerline_style        slanted
# wayland_titlebar_color system
linux_display_server auto

# Extras
# allow_remote_control yes
listen_on unix:/tmp/kitty


# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u


# BEGIN_KITTY_THEME
# Alabaster Dark
include current-theme.conf
# END_KITTY_THEME
